<script type="text/x-handlebars-template" id="tpl-step-body">
  <div class="text-base font-medium text-hi leading-relaxed">{{title}}</div>

  {{#if detail}}
    <div class="mt-1.5 text-sm text-muted leading-relaxed">{{detail}}</div>
  {{/if}}

  {{#if href}}
    <div class="mt-2">
      <a class="text-sm text-accent no-underline hover:underline leading-relaxed" href="{{href}}" target="_blank" rel="noopener noreferrer">{{#if linkLabel}}{{linkLabel}}{{else}}Open in a new tab{{/if}} &rarr;</a>
    </div>
  {{/if}}

  {{#if subSteps}}
    <div class="mt-4 flex flex-col gap-3 border-l border-border pl-4 pt-1">
      {{#each subSteps}}
        <div class="flex items-start gap-3">
          <span class="shrink-0 min-w-6 text-xs font-semibold text-accent leading-relaxed">{{../num}}.{{addOne @index}}</span>
          <div class="min-w-0">
            <div class="text-sm text-hi leading-relaxed">{{title}}</div>
            {{#if detail}}
              <div class="mt-1 text-xs text-muted leading-relaxed">{{detail}}</div>
            {{/if}}
            {{#if href}}
              <a class="mt-1 block text-xs text-accent no-underline hover:underline leading-relaxed" href="{{href}}" target="_blank" rel="noopener noreferrer">{{#if linkLabel}}{{linkLabel}}{{else}}Open in a new tab{{/if}} &rarr;</a>
            {{/if}}
          </div>
        </div>
      {{/each}}
    </div>
  {{/if}}
</script>

<script type="text/x-handlebars-template" id="tpl-step">
  <span class="step-num">{{num}}</span><div class="min-w-0">{{{body}}}</div>
</script>

<script type="text/x-handlebars-template" id="tpl-all-card">
  <div class="rounded border border-border bg-card px-5 py-5">
    <div class="flex items-start gap-3.5">{{{step}}}</div>
  </div>
</script>

<script type="text/x-handlebars-template" id="tpl-grid-btn">
  <span class="platform-icon">{{{icon}}}</span><span class="text-sm">{{label}}</span>
</script>

<script type="text/x-handlebars-template" id="tpl-link">
  <a class="text-sm text-accent no-underline hover:underline leading-relaxed" href="{{href}}" target="_blank" rel="noopener noreferrer">{{label}} &rarr;</a>
</script>

<script type="text/x-handlebars-template" id="tpl-note">
  <p class="text-xs text-subtle leading-relaxed">{{text}}{{#if source}} <a class="underline text-accent hover:text-hi" href="{{source.href}}" target="_blank" rel="noopener noreferrer">{{source.label}}</a>{{/if}}</p>
</script>

<script type="text/x-handlebars-template" id="tpl-notice">
  <div class="rounded border border-border bg-card px-5 py-5" style="border-left: 3px solid var(--color-accent-bright);">
    <div class="flex items-start gap-3.5">
      <svg class="shrink-0 text-accent" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <div class="min-w-0 flex flex-col gap-2">
        <div class="text-sm font-semibold text-hi leading-relaxed">{{title}}</div>
        {{#each items}}
        <p class="text-sm text-muted leading-relaxed"><span class="font-semibold text-hi">{{label}}:</span> {{text}}</p>
        {{/each}}
      </div>
    </div>
  </div>
</script>
