name: Test

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # pinner's canvasassets embeds aren't committed; stage them into the
      # pinned pinner module via pinner's ensure-canvasassets.sh. Needs
      # Node + pnpm. The plugin builds no JS of its own.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Stage canvasassets
        run: bash scripts/ensure-canvasassets.sh
      - run: go build -tags no_tunnel ./...
      - run: go vet -tags no_tunnel ./...
      - run: go test -tags no_tunnel ./...
