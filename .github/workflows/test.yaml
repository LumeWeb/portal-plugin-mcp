name: Test

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # `go generate ./...` is a no-op: the hosted MCP runtime is owned in-plugin
      # (internal/hosted) on the public go.lumeweb.com/pinner + mcpplane
      # contracts, with no pinner-cli/mcpembed dependency to regenerate assets
      # for, so no Node/pnpm toolchain is required on the runner.
      - name: Generate
        run: go generate ./...
      - run: go build -tags no_tunnel ./...
      - run: go vet -tags no_tunnel ./...
      - run: go test -tags no_tunnel ./...
