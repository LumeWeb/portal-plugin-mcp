name: Test

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # mcpembed regenerates pinner-cli's app JS bundles via pnpm, which is not
      # preinstalled on the runner. Node first, then pnpm (pinner-cli uses
      # pnpm 10 per its packageManager field).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Generate
        run: go generate ./...
      - run: go build -tags no_tunnel ./...
      - run: go vet -tags no_tunnel ./...
      - run: go test -tags no_tunnel ./...
