name: Build

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    uses: LumeWeb/workflows/.github/workflows/build-plugin.yml@develop
    with:
      additional_dependencies: 'go.lumeweb.com/portal-plugin-core@develop,go.lumeweb.com/portal-plugin-dashboard@develop'
      build_tags: no_tunnel
      # pinner's canvasassets embeds aren't committed; stage them into the
      # pinner module this build resolves before compiling.
      setup_script: |
        set -e
        command -v node >/dev/null 2>&1 || { echo "no node on image; installing"; curl -fsSL https://deb.nodesource.com/setup_22.x | bash -; apt-get install -y nodejs; }
        command -v pnpm >/dev/null 2>&1 || npm install -g pnpm@10.33.2
        bash scripts/ensure-canvasassets.sh
    secrets: inherit
