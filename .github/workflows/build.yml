name: Build

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    uses: LumeWeb/workflows/.github/workflows/build-plugin.yml@develop
    with:
      additional_dependencies: 'go.lumeweb.com/portal-plugin-core@develop,go.lumeweb.com/portal-plugin-dashboard@develop'
      build_tags: no_tunnel
      # The hosted MCP runtime is owned in-plugin (internal/hosted) on the
      # public go.lumeweb.com/pinner + mcpplane contracts; there is no
      # pinner-cli/mcpembed dependency, so `go generate ./...` is a no-op and no
      # Node/pnpm toolchain is needed to regenerate embed assets.
    secrets: inherit
